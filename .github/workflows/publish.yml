# Publish to PyPI + GitHub Release

# Pushing a version tag (v0.6.6) creates a GitHub Release and uploads to PyPI.
# Do NOT publish on every commit — PyPI versions are immutable and must be unique.
#
# One-time setup (manual): see README-developers.md → "Releasing to PyPI".

name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release
  id-token: write   # PyPI Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify tag matches setup.py version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c "import pathlib,re; t=pathlib.Path('setup.py').read_text(encoding='utf-8'); m=re.search(r\"version=['\\\"]([^'\\\"]+)['\\\"]\", t); print(m.group(1) if m else '')")"
          echo "tag=$TAG setup.py=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match setup.py version $VERSION — bump version, commit, then retag."
            exit 1
          fi

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
