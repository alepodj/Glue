<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Callbacks Demo</title>
  <script src="/glue.js"></script>
  <script src="/app.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; color: #e8f4ff; background: #071018; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 15% 15%, #182f63, transparent 42rem), #071018; }
    main { width: min(780px, 100%); padding: clamp(28px, 6vw, 64px); border: 1px solid rgb(62 200 255 / 24%); border-radius: 24px; background: rgb(10 18 28 / 84%); box-shadow: 0 28px 90px rgb(0 0 0 / 34%); }
    .eyebrow { margin: 0 0 12px; color: #3ec8ff; font: 700 .75rem/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4.5rem); letter-spacing: -.05em; }
    p { color: #a8bdd0; line-height: 1.65; }
    ul { display: grid; gap: 9px; margin: 26px 0 0; padding: 0; list-style: none; }
    li { padding: 12px 14px; border-left: 3px solid #3ec8ff; border-radius: 8px; color: #cde8f7; background: rgb(62 200 255 / 7%); font: .9rem/1.5 ui-monospace, monospace; }
    li.error { border-color: #ff6b81; color: #ffd4db; background: rgb(255 107 129 / 8%); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Example 03 · Async callbacks</p>
    <h1>Callbacks in both directions.</h1>
    <p>Successful values and deliberate errors appear as Python and JavaScript call each other.</p>
    <ul id="log" aria-live="polite"></ul>
  </main>
</body>
</html>
