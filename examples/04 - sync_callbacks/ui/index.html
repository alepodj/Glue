<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synchronous callbacks</title>
  <script src="/glue.js"></script>
  <script src="/app.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; color: #e8f4ff; background: #071018; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 80% 15%, #21345f, transparent 40rem), #071018; }
    main { width: min(720px, 100%); padding: clamp(32px, 7vw, 68px); border: 1px solid rgb(62 200 255 / 24%); border-radius: 24px; background: rgb(10 18 28 / 84%); box-shadow: 0 28px 90px rgb(0 0 0 / 34%); }
    .eyebrow { margin: 0 0 12px; color: #3ec8ff; font: 700 .75rem/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4.5rem); letter-spacing: -.05em; }
    p { color: #a8bdd0; line-height: 1.65; }
    output { display: block; margin-top: 28px; padding: 20px; border-radius: 14px; color: #73dcff; background: rgb(62 200 255 / 7%); font: 700 1rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Example 04 · Awaited results</p>
    <h1>Wait for the answer.</h1>
    <p>JavaScript awaits Python while Python performs the same synchronous-style call in reverse.</p>
    <output id="result">Waiting for Python…</output>
  </main>
</body>
</html>
