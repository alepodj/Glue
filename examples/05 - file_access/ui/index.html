<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python file access</title>
  <script src="/glue.js"></script>
  <script src="/app.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #e8f4ff; background: #071018; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 15% 80%, #153b45, transparent 40rem), #071018; }
    main { width: min(760px, 100%); padding: clamp(30px, 6vw, 64px); border: 1px solid rgb(62 200 255 / 24%); border-radius: 24px; background: rgb(10 18 28 / 84%); box-shadow: 0 28px 90px rgb(0 0 0 / 34%); }
    .eyebrow { margin: 0 0 12px; color: #3ec8ff; font: 700 .75rem/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4.5rem); letter-spacing: -.05em; }
    .lede { margin: 14px 0 28px; color: #a8bdd0; line-height: 1.65; }
    form { display: flex; gap: 10px; }
    input, button { min-height: 46px; border-radius: 11px; font: inherit; }
    input { flex: 1; min-width: 0; padding: 0 14px; border: 1px solid #2a4860; color: #e8f4ff; background: #0c1823; outline: none; }
    input:focus { border-color: #3ec8ff; box-shadow: 0 0 0 3px rgb(62 200 255 / 12%); }
    button { padding: 0 18px; border: 0; color: #041018; background: #3ec8ff; font-weight: 800; cursor: pointer; }
    output { display: block; min-height: 50px; margin-top: 14px; padding: 14px; border-radius: 11px; color: #80e8d5; background: rgb(26 155 184 / 10%); font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    @media (max-width: 560px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Example 05 · Filesystem bridge</p>
    <h1>Ask Python for a file.</h1>
    <p class="lede">The web UI supplies a folder; Python reads the filesystem and returns one filename.</p>
    <form id="picker-form">
      <input id="folder" aria-label="Folder path" placeholder="Enter a folder path" value="~">
      <button type="submit">Pick a file</button>
    </form>
    <output id="file-name" aria-live="polite">Waiting for a folder…</output>
  </main>

</body>
</html>
