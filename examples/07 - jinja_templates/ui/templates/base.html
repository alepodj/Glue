<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <script src="/glue.js"></script>
  <script src="/app.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #e8f4ff; background: #071018; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 20% 80%, #18365b, transparent 42rem), #071018; }
    main { width: min(720px, 100%); padding: clamp(32px, 7vw, 68px); border: 1px solid rgb(62 200 255 / 24%); border-radius: 24px; background: rgb(10 18 28 / 84%); box-shadow: 0 28px 90px rgb(0 0 0 / 34%); }
    .eyebrow { margin: 0 0 12px; color: #3ec8ff; font: 700 .75rem/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4.5rem); letter-spacing: -.05em; }
    p { color: #a8bdd0; line-height: 1.65; }
    .result { margin: 24px 0; padding: 14px; border-radius: 11px; color: #80e8d5; background: rgb(26 155 184 / 10%); font-family: ui-monospace, monospace; }
    nav { display: flex; gap: 10px; margin-top: 28px; }
    a { display: inline-flex; padding: 11px 15px; border: 1px solid rgb(62 200 255 / 30%); border-radius: 10px; color: #76dfff; text-decoration: none; }
    a:hover { background: rgb(62 200 255 / 8%); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
