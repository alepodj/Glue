<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cache control</title>
  <script src="/glue.js"></script>
  <script src="/app.js" defer></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #e8f4ff; background: #071018; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at 80% 15%, #3c294f, transparent 42rem), #071018; }
    main { width: min(720px, 100%); padding: clamp(32px, 7vw, 68px); border: 1px solid rgb(186 126 255 / 24%); border-radius: 24px; background: rgb(10 18 28 / 84%); box-shadow: 0 28px 90px rgb(0 0 0 / 34%); }
    .eyebrow { margin: 0 0 12px; color: #c899ff; font: 700 .75rem/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4.5rem); letter-spacing: -.05em; }
    .lede { margin: 14px 0 26px; color: #a8bdd0; line-height: 1.65; }
    output { display: block; padding: 16px; border-radius: 11px; color: #dabaff; background: rgb(186 126 255 / 9%); font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Example 09 · Cache headers</p>
    <h1>Fresh on every request.</h1>
    <p class="lede">Glue sends <code>Cache-Control: no-store</code>. Reload and inspect the network panel to confirm this script is fetched again.</p>
    <output id="cache-proof">Loading external script…</output>
  </main>
</body>
</html>
