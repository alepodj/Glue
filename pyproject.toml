[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["projects", ".tox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",   # long lines / strings — OK for this codebase
  "UP031",  # % formatting still used widely in glue/
  "SIM105", # try/except pass is fine for best-effort cleanup
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
