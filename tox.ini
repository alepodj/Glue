[tox]
envlist = typecheck,py{310,311,312,313,314}

[pytest]
timeout = 30

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314


[testenv]
description = run py.test tests
deps = -r requirements-test.txt
commands =
  # this ugly hack is here because:
  # https://github.com/tox-dev/tox/issues/149
  pip install -q -r '{toxinidir}'/requirements-test.txt
  '{envpython}' -m pytest {posargs}

[testenv:typecheck]
description = run type checks
deps =  -r requirements-test.txt
commands =
  mypy --strict {posargs:glue}
