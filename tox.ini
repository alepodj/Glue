[tox]
envlist = lint, typecheck, py{310,311,312,313,314}

[pytest]
timeout = 240

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
description = run pytest
deps = -r requirements-test.txt
# Tox often omits USERNAME on Windows. Python 3.13+ getpass.getuser() then
# raises OSError, which breaks pytest's tmp_path (and anything using ~).
passenv =
    USERNAME
    USERPROFILE
    HOME
setenv =
    USERNAME = {env:USERNAME:glue}
commands =
  pip install -q -r '{toxinidir}'/requirements-test.txt
  '{envpython}' -m pytest {posargs:tests}

[testenv:lint]
description = ruff lint + format check
skip_install = false
deps = -r requirements-test.txt
commands =
  ruff check glue tests examples
  ruff format --check glue tests examples

[testenv:typecheck]
description = run mypy
deps = -r requirements-test.txt
commands =
  mypy --strict {posargs:glue}
